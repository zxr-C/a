<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#150f26">
<title>测测你的隐藏人格，连你自己都没发现</title>
<style>
  :root {
    --bg-0: #120d20;
    --bg-1: #1c1430;
    --bg-2: #271a40;
    --ink: #f0eaf8;
    --muted: #a99ec6;
    --dim: #81779c;
    --gold: #d9b36a;
    --gold-2: #f0d28a;
    --lav: #c3a6ff;
    --line: rgba(195, 166, 255, 0.18);
    --card: rgba(255, 255, 255, 0.045);
    --glow: rgba(195, 166, 255, 0.35);
    --serif: "Georgia", "Songti SC", "STSong", "SimSun", serif;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 46%, var(--bg-2) 100%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    letter-spacing: 0;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    justify-content: center;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 11% 20%, rgba(240, 234, 248, 0.9), transparent 60%),
      radial-gradient(1px 1px at 28% 9%, rgba(240, 234, 248, 0.7), transparent 60%),
      radial-gradient(1.5px 1.5px at 47% 26%, rgba(217, 179, 106, 0.8), transparent 60%),
      radial-gradient(1px 1px at 63% 14%, rgba(240, 234, 248, 0.65), transparent 60%),
      radial-gradient(1.5px 1.5px at 79% 22%, rgba(195, 166, 255, 0.85), transparent 60%),
      radial-gradient(1px 1px at 91% 12%, rgba(240, 234, 248, 0.7), transparent 60%),
      radial-gradient(1px 1px at 7% 62%, rgba(195, 166, 255, 0.55), transparent 60%),
      radial-gradient(1.5px 1.5px at 16% 82%, rgba(240, 234, 248, 0.6), transparent 60%),
      radial-gradient(1px 1px at 36% 72%, rgba(217, 179, 106, 0.55), transparent 60%),
      radial-gradient(1.5px 1.5px at 55% 88%, rgba(240, 234, 248, 0.5), transparent 60%),
      radial-gradient(1px 1px at 73% 78%, rgba(195, 166, 255, 0.6), transparent 60%),
      radial-gradient(1.5px 1.5px at 88% 66%, rgba(240, 234, 248, 0.55), transparent 60%);
  }

  .app {
    width: 100%;
    max-width: 760px;
    padding: 36px 20px 76px;
  }

  .page {
    display: none;
    animation: pageIn 0.4s ease both;
  }

  .page.active {
    display: block;
  }

  @keyframes pageIn {
    from {
      opacity: 0;
      transform: translateY(14px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  button {
    font: inherit;
    cursor: pointer;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
    color: var(--gold-2);
    font-size: 13px;
    font-weight: 600;
  }

  .eyebrow .star {
    color: var(--gold);
  }

  /* Start page */
  .start-wrap {
    text-align: center;
    padding-top: 34px;
  }

  .start-wrap h1 {
    margin: 26px auto 16px;
    max-width: 660px;
    font-family: var(--serif);
    font-size: clamp(31px, 7vw, 48px);
    line-height: 1.22;
    font-weight: 700;
  }

  .start-wrap h1 .gold {
    color: var(--gold-2);
  }

  .start-wrap .subtitle {
    max-width: 500px;
    margin: 0 auto;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.85;
  }

  .mirror {
    width: 210px;
    height: auto;
    margin: 4px auto 2px;
    display: block;
    filter: drop-shadow(0 18px 36px rgba(99, 66, 168, 0.55));
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 30px;
    padding: 15px 32px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: #241a3d;
    font-size: 17px;
    font-weight: 800;
    box-shadow: 0 14px 34px rgba(217, 179, 106, 0.28);
    transition: transform 0.16s ease, box-shadow 0.16s ease;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 18px 40px rgba(217, 179, 106, 0.38);
  }

  .btn-primary:active {
    transform: translateY(0);
  }

  .btn-primary svg {
    width: 18px;
    height: 18px;
  }

  .disclaimer {
    margin: 34px auto 0;
    max-width: 480px;
    color: #6f668a;
    font-size: 12px;
    line-height: 1.6;
  }

  /* Quiz page */
  .quiz-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .quiz-count {
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
  }

  .quiz-pct {
    font-size: 14px;
    font-weight: 800;
    color: var(--gold-2);
  }

  .progress {
    height: 6px;
    border-radius: 999px;
    background: rgba(195, 166, 255, 0.14);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--gold), var(--lav));
    transition: width 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .question {
    margin: 40px 0 28px;
    font-family: var(--serif);
    font-size: clamp(23px, 5vw, 32px);
    line-height: 1.45;
    font-weight: 600;
    text-align: center;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 15px 16px;
    text-align: left;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.045);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.5;
    transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease,
      box-shadow 0.14s ease;
  }

  .option:hover {
    transform: translateY(-2px);
    border-color: rgba(217, 179, 106, 0.65);
    background: rgba(217, 179, 106, 0.08);
  }

  .option .letter {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border-radius: 9px;
    background: rgba(195, 166, 255, 0.16);
    color: var(--lav);
    font-size: 14px;
    font-weight: 800;
    transition: background 0.14s ease, color 0.14s ease;
  }

  .option.picked {
    border-color: var(--gold);
    background: rgba(217, 179, 106, 0.14);
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(217, 179, 106, 0.16);
  }

  .option.picked .letter {
    background: var(--gold);
    color: #241a3d;
  }

  .quiz-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 30px;
  }

  .nav-btn {
    flex: 0 0 auto;
    padding: 9px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    transition: border-color 0.14s ease, color 0.14s ease, background 0.14s ease;
  }

  .nav-btn:hover:not(:disabled) {
    border-color: var(--gold);
    color: var(--gold-2);
    background: rgba(217, 179, 106, 0.08);
  }

  .nav-btn:disabled {
    opacity: 0.28;
    cursor: default;
  }

  .nav-hint {
    flex: 1 1 auto;
    text-align: center;
    color: #7e739b;
    font-size: 12px;
    white-space: nowrap;
  }

  /* Result page */
  .result-wrap {
    text-align: center;
    max-width: 560px;
    margin: 0 auto;
  }

  .rarity {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    border-radius: 999px;
    background: rgba(195, 166, 255, 0.1);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
  }

  .rarity b {
    color: var(--gold-2);
    font-weight: 800;
  }

  .result-icon {
    margin: 28px auto 8px;
    font-size: 76px;
    line-height: 1;
    filter: drop-shadow(0 12px 24px rgba(99, 66, 168, 0.55));
  }

  .result-name {
    margin: 16px 0 10px;
    font-family: var(--serif);
    font-size: clamp(30px, 6.5vw, 42px);
    font-weight: 700;
    color: var(--gold-2);
  }

  .result-quote {
    margin: 0 auto;
    max-width: 480px;
    color: var(--muted);
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.8;
    font-style: italic;
  }

  .result-match {
    margin-top: 18px;
    color: var(--gold-2);
    font-size: 15px;
    font-weight: 800;
  }

  .result-tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 9px;
    margin-top: 14px;
  }

  .tag {
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(195, 166, 255, 0.12);
    border: 1px solid var(--line);
    color: var(--lav);
    font-size: 13px;
    font-weight: 650;
  }

  .divider {
    height: 1px;
    margin: 28px 0;
    background: linear-gradient(90deg, transparent, rgba(217, 179, 106, 0.55), transparent);
  }

  .result-block {
    text-align: left;
    margin-bottom: 16px;
    padding: 18px 20px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
  }

  .result-block h3 {
    margin: 0 0 10px;
    font-size: 14px;
    font-weight: 800;
    color: var(--gold-2);
    letter-spacing: 0;
  }

  .result-block p {
    margin: 0;
    color: #cfc6e4;
    font-size: 15px;
    line-height: 1.85;
  }

  .result-footer {
    margin-top: 28px;
    color: #6f668a;
    font-size: 12px;
    line-height: 1.6;
  }

  @media (max-width: 520px) {
    .app {
      padding: 26px 16px 56px;
    }
    .option {
      padding: 14px;
      font-size: 15px;
    }
    .nav-hint {
      white-space: normal;
      font-size: 11px;
    }
    .quiz-nav {
      gap: 8px;
    }
  }
</style>
</head>
<body>
  <main class="app">
    <!-- 开始页 -->
    <section id="page-start" class="page active">
      <div class="start-wrap">
        <span class="eyebrow"><span class="star">✦</span>隐藏人格鉴定</span>

        <svg class="mirror" viewBox="0 0 210 230" role="img" aria-label="魔法镜">
          <defs>
            <linearGradient id="mirrorGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#3b2766"/>
              <stop offset="55%" stop-color="#241a40"/>
              <stop offset="100%" stop-color="#120d20"/>
            </linearGradient>
          </defs>
          <ellipse cx="105" cy="125" rx="68" ry="92" fill="none" stroke="#d9b36a" stroke-width="12"/>
          <ellipse cx="105" cy="125" rx="59" ry="83" fill="url(#mirrorGrad)" stroke="#f0d28a" stroke-width="2"/>
          <path d="M68 118 Q105 84 144 116" fill="none" stroke="rgba(195,166,255,0.5)" stroke-width="2"/>
          <path d="M74 140 Q105 168 138 138" fill="none" stroke="rgba(217,179,106,0.45)" stroke-width="2"/>
          <path d="M105 42 L110 64 L128 52 Z" fill="#f0d28a"/>
          <circle cx="72" cy="60" r="2.4" fill="#f0eaf8" opacity="0.85"/>
          <circle cx="148" cy="86" r="2" fill="#c3a6ff"/>
          <circle cx="152" cy="176" r="2.4" fill="#f0d28a" opacity="0.8"/>
          <circle cx="56" cy="182" r="2" fill="#f0eaf8" opacity="0.75"/>
        </svg>

        <h1>测测你的<span class="gold">隐藏人格</span>，连你自己都没发现</h1>
        <p class="subtitle">有些性格，藏在连你自己都没察觉的角落。现在，让这面镜子照见那个被你藏起来的自己。</p>

        <button id="startBtn" class="btn-primary" type="button">
          开启鉴定
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>

        <p class="disclaimer">仅供娱乐，不构成心理评估/诊断。请跟着第一感觉作答。</p>
      </div>
    </section>

    <!-- 题目页 -->
    <section id="page-quiz" class="page">
      <div class="quiz-head">
        <span id="quizCount" class="quiz-count">第 1 / 30 题</span>
        <span id="quizPct" class="quiz-pct">0%</span>
      </div>
      <div class="progress"><div id="progressFill" class="progress-fill"></div></div>

      <h2 id="questionText" class="question"></h2>
      <div id="options" class="options"></div>

      <div class="quiz-nav">
        <button id="prevBtn" class="nav-btn" type="button">‹ 上一题</button>
        <span id="navHint" class="nav-hint">选择后自动进入下一题</span>
        <button id="nextBtn" class="nav-btn" type="button">下一题 ›</button>
      </div>
    </section>

    <!-- 结果页 -->
    <section id="page-result" class="page">
      <div class="result-wrap">
        <span class="rarity">稀有度 <b id="rarityVal"></b></span>
        <div id="resultIcon" class="result-icon"></div>
        <h2 id="resultName" class="result-name"></h2>
        <p id="resultQuote" class="result-quote"></p>
        <div id="resultMatch" class="result-match"></div>
        <div id="resultTags" class="result-tags"></div>
        <div class="divider"></div>
        <div class="result-block">
          <h3>详细描述</h3>
          <p id="resultDetail"></p>
        </div>
        <div class="result-block">
          <h3>隐藏优势</h3>
          <p id="resultStrength"></p>
        </div>
        <div class="result-block">
          <h3>小提醒</h3>
          <p id="resultTip"></p>
        </div>
        <button id="restartBtn" class="btn-primary" type="button">
          再测一次
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <p class="result-footer">仅供娱乐，不构成心理评估/诊断。</p>
      </div>
    </section>
  </main>

  <script>
    const PERSONALITIES = [
      {
        name: "月光收藏家",
        emoji: "🌙",
        color: "#c3a6ff",
        rarity: 12,
        quote: "别人在数日子，你在收集月光。",
        tags: ["感性", "念旧", "浪漫"],
        detail: "你习惯把柔软的那一面收进抽屉，只在独处时轻轻打开。你会因为一段旋律、一束黄昏或一句不经意的温柔而心动很久，也会把喜欢的片段反复回味，像收藏一枚枚发亮的月亮。你未必张扬，却总在细节里留下诗意：一首歌、一张旧照片、一次没有说破的对视，都能被你读出别人看不见的层次。你怕被看穿，所以常常装作不在意，其实心里早就起风了。",
        strength: "你的共情力与审美力都很强，能从平淡里读出别人忽略的层次，也擅长把情绪安放得恰到好处。你会让人在不知不觉中被你柔软地接住，却又不觉得被冒犯，这是很稀缺的温柔。",
        tip: "别总把温柔留到深夜，偶尔也让它在白天见见光；你的浪漫值得被看见。"
      },
      {
        name: "清醒的伪装者",
        emoji: "🦋",
        color: "#e6c87a",
        rarity: 9,
        quote: "你看上去很好说话，其实心里早有答案。",
        tags: ["目标感", "清醒", "行动派"],
        detail: "你很少把野心写在脸上。别人以为你随和、无所谓，其实你一直在心里画地图，知道下一站去哪、下一步怎么走，也清楚自己要付出什么、放弃什么。你善于在不动声色中观察局势、判断轻重，等时机一到就稳稳出手。你不是计较，只是不愿意浪费自己的可能性。温和是你的外壳，清晰才是你的底色；你看似让了半步，其实早就算好了三步。",
        strength: "你的目标感和执行力都很在线，擅长把大目标拆成能落地的步骤，并持续地朝结果靠近。你也很有分寸感，懂得什么时候藏、什么时候露，这让你在复杂环境里显得格外可靠。",
        tip: "适时让别人看到你的野心和努力，会减少很多不必要的误解，也能帮你争取到本该属于你的支持。"
      },
      {
        name: "深海思考者",
        emoji: "🌊",
        color: "#8aa0ff",
        rarity: 14,
        quote: "别人说“别想太多”，你已经在想“为什么”。",
        tags: ["理性", "好奇", "洞察"],
        detail: "你天生爱追问意义，习惯把生活拆成一个个问题去理解：为什么人会这样想、为什么事情会这样发生、什么才真正值得。热闹是你的背景音，思考才是你的主场，很多别人一带而过的东西，都会在你脑子里被反复拆解、重组。你看起来冷静甚至疏离，其实只是把喧嚣让给了世界，把深度留给了自己。你需要的不是被理解，而是被允许慢慢想明白。",
        strength: "你的逻辑清晰、洞察力强，总能看到事情背后的结构和规律，也能在混乱中抓住真正的关键。别人还在就事论事，你往往已经看到了更深一层的因果。",
        tip: "想得深很好，但别忘了回到此刻。答案有时不在脑子里，而在一次真实的体验里。"
      },
      {
        name: "温柔反叛者",
        emoji: "🕊️",
        color: "#d48cff",
        rarity: 11,
        quote: "表面安安稳稳，心里早就想翻墙出去看世界。",
        tags: ["自由", "勇气", "随性"],
        detail: "你有一副让人安心的样子，却总在心底渴望新鲜、未知和一点越界的刺激。你可能是那个在计划表旁偷偷查机票的人，也可能是那个在大家都说“算了”时，安静说出“要不试试”的人。你不喜欢被一条路绑住，总想看看围栏外面还有什么，也愿意为一次没来由的心动临时改变行程。你的叛逆不吵闹、不伤人，却很有力量，像一株向着光长歪了也照样开花的植物。",
        strength: "你的适应力和胆量兼具，既能把眼前的日子过稳，也敢在关键时刻迈出那一步。你很少被“应该怎样”框住，所以总能在别人犹豫时率先找到出口。",
        tip: "想出发的时候不用等“万事俱备”，方向对了就可以先走；有些路，走起来才有答案。"
      },
      {
        name: "沉默的守灯人",
        emoji: "🏮",
        color: "#f0b46b",
        rarity: 13,
        quote: "你记得每个人的口味，却总忘记自己的。",
        tags: ["可靠", "共情", "责任感"],

    const LETTERS = ["A", "B", "C", "D"];
    const TOTAL = QUESTIONS.length;

    const $ = (id) => document.getElementById(id);
    const pages = {
      start: $("page-start"),
      quiz: $("page-quiz"),
      result: $("page-result")
    };

    let current = 0;
    let answers = new Array(TOTAL).fill(-1);
    let locked = false;
    let timer = null;

    function showPage(name) {
      Object.keys(pages).forEach((key) => {
        pages[key].classList.toggle("active", key === name);
      });
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderQuestion() {
      clearTimeout(timer);
      locked = false;
      const item = QUESTIONS[current];
      $("quizCount").textContent = `第 ${current + 1} / ${TOTAL} 题`;
      const pct = Math.round((current / TOTAL) * 100);
      $("quizPct").textContent = `${pct}%`;
      $("progressFill").style.width = `${pct}%`;
      $("questionText").textContent = item.q;
      const isLast = current === TOTAL - 1;
      $("navHint").textContent = isLast
        ? "选择后点击『查看结果』"
        : "选择后自动进入下一题";
      $("nextBtn").textContent = isLast ? "查看结果 ›" : "下一题 ›";
      $("prevBtn").disabled = current === 0;
      $("nextBtn").disabled = answers[current] === -1;

      const box = $("options");
      box.innerHTML = "";
      item.o.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option";
        btn.dataset.index = i;
        if (answers[current] === i) btn.classList.add("picked");
        const letter = document.createElement("span");
        letter.className = "letter";
        letter.textContent = LETTERS[i];
        const text = document.createElement("span");
        text.textContent = opt[0];
        btn.appendChild(letter);
        btn.appendChild(text);
        box.appendChild(btn);
      });
    }

    function selectOption(i) {
      if (locked) return;
      locked = true;
      answers[current] = i;

      const btns = Array.from($("options").children);
      btns.forEach((b) => b.classList.remove("picked"));
      btns[i].classList.add("picked");

      const pct = Math.round(((current + 1) / TOTAL) * 100);
      $("progressFill").style.width = `${pct}%`;
      $("quizPct").textContent = `${pct}%`;
      $("nextBtn").disabled = false;

      if (current < TOTAL - 1) {
        timer = setTimeout(() => {
          current += 1;
          renderQuestion();
        }, 300);
      } else {
        locked = false;
      }
    }

    function go(delta) {
      clearTimeout(timer);
      locked = false;
      const next = current + delta;
      if (next < 0 || next >= TOTAL) return;
      current = next;
      renderQuestion();
    }

    function computeScores() {
      const s = new Array(8).fill(0);
      QUESTIONS.forEach((item, qi) => {
        const ans = answers[qi];
        if (ans < 0) return;
        const opt = item.o[ans];
        s[opt[1]] += 2;
        if (opt[2] !== undefined) s[opt[2]] += 1;
      });
      return s;
    }

    function showResult() {
      const scores = computeScores();
      const values = scores;
      const max = Math.max(...values);
      const min = Math.min(...values);
      const winnerIndex = max - min <= 3 ? 8 : values.indexOf(max);
      const total = values.reduce((a, b) => a + b, 0) || 1;
      const p = PERSONALITIES[winnerIndex];

      $("rarityVal").textContent = `${p.rarity}%`;
      $("resultIcon").textContent = p.emoji;
      $("resultName").textContent = p.name;
      $("resultName").style.color = p.egg ? "#c7bfd6" : p.color;
      $("resultQuote").textContent = `“${p.quote}”`;
      $("resultMatch").textContent =
        p.egg ? "匹配度 100%" : `匹配度 ${Math.min(98, 78 + Math.round((max / total) * 20))}%`;
      $("resultDetail").textContent = p.detail;
      $("resultStrength").textContent = p.strength;
      $("resultTip").textContent = p.tip;

      const tags = $("resultTags");
      tags.innerHTML = "";
      p.tags.forEach((t) => {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = `#${t}`;
        tags.appendChild(span);
      });

      showPage("result");
    }

    function restart() {
      current = 0;
      answers = new Array(TOTAL).fill(-1);
      locked = false;
      clearTimeout(timer);
      renderQuestion();
      showPage("quiz");
    }

    $("startBtn").addEventListener("click", restart);
    $("restartBtn").addEventListener("click", restart);
    $("prevBtn").addEventListener("click", () => go(-1));
    $("nextBtn").addEventListener("click", () => {
      if (answers[current] === -1) return;
      clearTimeout(timer);
      if (current === TOTAL - 1) {
        showResult();
      } else {
        current += 1;
        renderQuestion();
      }
    });

    $("options").addEventListener("click", (e) => {
      const btn = e.target.closest(".option");
      if (btn) selectOption(Number(btn.dataset.index));
    });
